<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reproductor de Música para Ensayos</title>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.player{
    background:#1f2937;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 25px rgba(0,0,0,.4);
}

h1{
    text-align:center;
}

.current{
    font-size:22px;
    color:#60a5fa;
    margin-bottom:15px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
}

button{
    background:#2563eb;
    border:none;
    color:white;
    font-size:20px;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#3b82f6;
}

#progress,
#volume{
    width:100%;
}

.time{
    text-align:center;
    margin-top:10px;
}

.playlist{
    margin-top:20px;
    background:#1f2937;
    border-radius:15px;
    overflow:hidden;
}

.song{
    padding:15px;
    border-bottom:1px solid #374151;
    cursor:pointer;
}

.song:hover{
    background:#374151;
}

.active{
    background:#2563eb;
}

.total{
    margin-top:15px;
    color:#9ca3af;
}

</style>
</head>

<body>

<div class="container">

<div class="player">

<h1>🎵 Reproductor de Música para Ensayos 🎵</h1>

<div class="current" id="currentSong">
Selecciona una canción
</div>

<audio id="audio"></audio>

<input type="range" id="progress" value="0">

<div class="time">
<span id="currentTime">0:00</span>
 /
<span id="duration">0:00</span>
</div>

<div class="controls">
<button onclick="prevSong()">⏮</button>
<button onclick="audio.play()">▶</button>
<button onclick="audio.pause()">⏸</button>
<button onclick="stopSong()">⏹</button>
<button onclick="nextSong()">⏭</button>
</div>

🔊

<input type="range" id="volume"
min="0"
max="1"
step="0.1"
value="1">

<div class="total">
10 canciones
</div>

</div>

<div class="playlist" id="playlist"></div>

</div>


<script>

const songs = [

{
title:"Dios es Nuestro Refugio",
file:"music/01-Dios-es-Nuestro-Refugio.mp3"
},

{
title:"Cristo Llamando Está",
file:"music/02-Cristo-Llamando-esta.mp3"
},

{
title:"Padre de Amor",
file:"music/08-Padre-de-Amor.mp3"
},

{
title:"Dios es Nuestro Refugio (Pista)",
file:"music/09-Dios-es-Nuestro-P-.mp3"
},

{
title:"Cristo Llamando (Pista)",
file:"music/10-Cristo-Llamando-P-.mp3"
},

{
title:"Padre de Amor (Pista)",
file:"music/13-Padre-de-Amor-P-.mp3"
},

{
title:"Dame Agua Viva",
file:"music/Dame-agua-viva.mp3"
},

{
title:"Por Su Gran Amor",
file:"music/Por-su-gran-amor.mp3"
},

{
title:"Solo a Mi Dios Yo Alabo",
file:"music/Solo-a-mi-Dios-yo-alabo.mp3"
},

{
title:"Tú Eres Santo",
file:"music/Tu-eres-Santo.mp3"
}

{
title:"Nuevo Corazon",
file:"music/Nuevo-Corazon-DemoAlfredo.mp3"
}

{
title:"Nuevo Corazon (Pista)",
file:"music/Nuevo-Corazon-P.mp3"
}

];

let current = 0;

const audio=document.getElementById("audio");
const currentSong=document.getElementById("currentSong");
const playlist=document.getElementById("playlist");
const progress=document.getElementById("progress");

function renderPlaylist(){

playlist.innerHTML="";

songs.forEach((song,index)=>{

const item=document.createElement("div");

item.className="song";

if(index===current){
item.classList.add("active");
}

item.innerHTML=song.title;

item.onclick=()=>{

current=index;

loadSong();

audio.play();

};

playlist.appendChild(item);

});

}

function loadSong(){

audio.src=songs[current].file;

currentSong.innerHTML=songs[current].title;

renderPlaylist();

}

function nextSong(){

current++;

if(current>=songs.length){
current=0;
}

loadSong();

audio.play();

}

function prevSong(){

current--;

if(current<0){
current=songs.length-1;
}

loadSong();

audio.play();

}

function stopSong(){

audio.pause();

audio.currentTime=0;

}

audio.addEventListener("ended",nextSong);

audio.addEventListener("timeupdate",()=>{

progress.value=(audio.currentTime/audio.duration)*100||0;

document.getElementById("currentTime").innerHTML=
formatTime(audio.currentTime);

document.getElementById("duration").innerHTML=
formatTime(audio.duration);

});

progress.addEventListener("input",()=>{

audio.currentTime=
(progress.value/100)*audio.duration;

});

document.getElementById("volume")
.addEventListener("input",(e)=>{

audio.volume=e.target.value;

});

function formatTime(time){

if(isNaN(time)) return "0:00";

let min=Math.floor(time/60);
let sec=Math.floor(time%60);

return min+":"+(sec<10?"0":"")+sec;

}

loadSong();

</script>

</body>
</html>
