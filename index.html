<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reproductor de Música para Ensayos</title>

<style>
body{
    margin:0;
    background:#07152e;
    color:white;
    font-family:Segoe UI, Arial, sans-serif;
}

.container{
    max-width:900px;
    margin:15px auto;
    padding:10px;
}

.player{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-top:0;
}

#currentSong{
    color:#60a5fa;
    font-size:24px;
    margin:20px 0;
}

#progress{
    width:100%;
}

.time{
    text-align:center;
    margin:12px 0;
    font-weight:bold;
}

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
    flex-wrap:wrap;
}

button{
    border:none;
    background:#2563eb;
    color:white;
    font-size:20px;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#3b82f6;
}

#volume{
    width:100%;
}

.total{
    margin-top:20px;
    color:#cbd5e1;
}

.playlist{
    margin-top:20px;
    background:#1e293b;
    border-radius:15px;
    overflow:hidden;
}

.song{
    padding:15px;
    cursor:pointer;
    border-bottom:1px solid #334155;
}

.song:hover{
    background:#334155;
}

.active{
    background:#2563eb;
}
</style>
</head>

<body>

<div class="container">

<div class="player">

<h1>🎵 Reproductor de Música para Ensayos 🎵</h1>

<div id="currentSong">
Dios es Nuestro Refugio
</div>

<audio id="audio"></audio>

<input type="range" id="progress" value="0">

<div class="time">
<span id="currentTime">0:00</span>
 /
<span id="duration">0:00</span>
</div>

<div class="controls">
<button onclick="prevSong()">⏮</button>
<button onclick="audio.play()">▶</button>
<button onclick="audio.pause()">⏸</button>
<button onclick="stopSong()">⏹</button>
<button onclick="nextSong()">⏭</button>
</div>

<div>
🔊
<input type="range" id="volume" min="0" max="1" step="0.1" value="1">
</div>

<div class="total">
16 canciones disponibles
</div>

</div>

<div class="playlist" id="playlist"></div>

</div>

<script>

const songs = [


{
title:"La Armadura de Dios",
file:"music/La-Armadura-de-Dios.mp3"
},

{
title:"Cristo en la historia",
file:"music/Cristo-En-La-Historia.mp3"
},

{
title:"El mundo no es mi hogar",
file:"music/El-Mundo-no-es-mi-Hogar.mp3"
},

{
title:"Dios es Nuestro Refugio",
file:"music/01-Dios-es-Nuestro-Refugio.mp3"
},

{
title:"Cristo Llamando Está",
file:"music/02-Cristo-Llamando-esta.mp3"
},

{
title:"Padre de Amor",
file:"music/08-Padre-de-Amor.mp3"
},

{
title:"Dios es Nuestro Refugio (Pista)",
file:"music/09-Dios-es-Nuestro-P-.mp3"
},

{
title:"Cristo Llamando (Pista)",
file:"music/10-Cristo-Llamando-P-.mp3"
},

{
title:"Padre de Amor (Pista)",
file:"music/13-Padre-de-Amor-P-.mp3"
},

{
title:"Dame Agua Viva",
file:"music/Dame-agua-viva.mp3"
},

{
title:"Nuevo Corazón",
file:"music/Nuevo-Corazon-DemoAlfredo.mp3"
},

{
title:"Nuevo Corazón (Pista)",
file:"music/Nuevo-Corazon-P.mp3"
},

{
title:"Por Su Gran Amor",
file:"music/Por-su-gran-amor.mp3"
},

{
title:"Solo a Mi Dios Yo Alabo",
file:"music/Solo-a-mi-Dios-yo-alabo.mp3"
},

{
title:"Edith Aravena - Tu Camino",
file:"music/Edith Aravena - Tu Camino.mp3"
},

{
title:"Tú Eres Santo",
file:"music/Tu-eres-Santo.mp3"
}

];

let current = 0;

const audio = document.getElementById("audio");
const playlist = document.getElementById("playlist");
const currentSong = document.getElementById("currentSong");
const progress = document.getElementById("progress");

function renderPlaylist(){

playlist.innerHTML="";

songs.forEach((song,index)=>{

const item=document.createElement("div");

item.className="song";

if(index===current){
item.classList.add("active");
}

item.textContent=song.title;

item.onclick=()=>{
current=index;
loadSong();
audio.play();
};

playlist.appendChild(item);

});

}

function loadSong(){

audio.src=songs[current].file;

currentSong.textContent=songs[current].title;

renderPlaylist();

}

function nextSong(){

current++;

if(current>=songs.length){
current=0;
}

loadSong();
audio.play();

}

function prevSong(){

current--;

if(current<0){
current=songs.length-1;
}

loadSong();
audio.play();

}

function stopSong(){

audio.pause();
audio.currentTime=0;

}

audio.addEventListener("ended",nextSong);

audio.addEventListener("timeupdate",()=>{

progress.value=(audio.currentTime/audio.duration)*100||0;

document.getElementById("currentTime").textContent=
formatTime(audio.currentTime);

document.getElementById("duration").textContent=
formatTime(audio.duration);

});

progress.addEventListener("input",()=>{

audio.currentTime=
(progress.value/100)*audio.duration;

});

document.getElementById("volume")
.addEventListener("input",(e)=>{

audio.volume=e.target.value;

});

function formatTime(time){

if(isNaN(time)) return "0:00";

let min=Math.floor(time/60);
let sec=Math.floor(time%60);

return min + ":" + (sec < 10 ? "0" : "") + sec;

}

loadSong();

</script>

</body>
</html>
