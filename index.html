<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Conjunto Fortaleza</title>

<style>

body{
    margin:0;
    background:#181818;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;
}

.player{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.titulo{
    text-align:center;
    font-size:28px;
    margin-bottom:20px;
}

.info{
    background:#202020;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

#songTitle{
    font-size:20px;
    color:#4fc3f7;
}

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

button{
    background:#4fc3f7;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#29b6f6;
}

#progress{
    width:100%;
}

.playlist{
    background:#202020;
    border-radius:10px;
    overflow:hidden;
}

.song{
    padding:12px;
    border-bottom:1px solid #333;
    cursor:pointer;
}

.song:hover{
    background:#2e2e2e;
}

.active{
    background:#1565c0;
}

.time{
    text-align:center;
    margin-top:10px;
}

.volume{
    margin-top:15px;
}

input[type=range]{
    width:100%;
}

</style>
</head>
<body>

<div class="player">

<div class="titulo">
🎵 Conjunto Fortaleza
</div>

<div class="info">
<div id="songTitle">
02 Cristo Llamando está
</div>
</div>

<audio id="audio"></audio>

<div class="controls">
<button onclick="prevSong()">⏮</button>
<button onclick="playSong()">▶</button>
<button onclick="pauseSong()">⏸</button>
<button onclick="stopSong()">⏹</button>
<button onclick="nextSong()">⏭</button>
</div>

<input type="range" id="progress" value="0">

<div class="time">
<span id="current">0:00</span>
 /
<span id="duration">0:00</span>
</div>

<div class="volume">
🔊
<input type="range" id="volume" min="0" max="1" step="0.1" value="1">
</div>

<br>

<div class="playlist" id="playlist"></div>

</div>

<script>

const songs = [
{
title:"02 Cristo Llamando está",
file:"02 Cristo Llamando está.mp3"
}
];

let currentSong=0;

const audio=document.getElementById("audio");
const playlist=document.getElementById("playlist");
const title=document.getElementById("songTitle");

function renderPlaylist(){

playlist.innerHTML="";

songs.forEach((song,index)=>{

const div=document.createElement("div");

div.className="song";

if(index===currentSong){
div.classList.add("active");
}

div.textContent=song.title;

div.onclick=()=>{
currentSong=index;
loadSong();
audio.play();
};

playlist.appendChild(div);

});

}

function loadSong(){

audio.src=songs[currentSong].file;

title.textContent=songs[currentSong].title;

renderPlaylist();

}

function playSong(){
audio.play();
}

function pauseSong(){
audio.pause();
}

function stopSong(){
audio.pause();
audio.currentTime=0;
}

function nextSong(){

currentSong++;

if(currentSong>=songs.length){
currentSong=0;
}

loadSong();
audio.play();

}

function prevSong(){

currentSong--;

if(currentSong<0){
currentSong=songs.length-1;
}

loadSong();
audio.play();

}

audio.addEventListener("ended",()=>{

currentSong++;

if(currentSong>=songs.length){
currentSong=0;
}

loadSong();
audio.play();

});

const progress=document.getElementById("progress");

audio.addEventListener("timeupdate",()=>{

progress.value=(audio.currentTime/audio.duration)*100 || 0;

document.getElementById("current").textContent=
formatTime(audio.currentTime);

document.getElementById("duration").textContent=
formatTime(audio.duration);

});

progress.addEventListener("input",()=>{

audio.currentTime=
(progress.value/100)*audio.duration;

});

document.getElementById("volume")
.addEventListener("input",(e)=>{
audio.volume=e.target.value;
});

function formatTime(time){

if(isNaN(time)) return "0:00";

let min=Math.floor(time/60);
let sec=Math.floor(time%60);

return min+":"+(sec<10?"0":"")+sec;

}

loadSong();

</script>

</body>
</html>
